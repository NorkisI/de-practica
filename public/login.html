<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | Nexus Auth</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Fondo animado -->
  <div class="background-animation">
    <div class="gradient-circle circle-1"></div>
    <div class="gradient-circle circle-2"></div>
  </div>

  <div class="container">
    <div class="logo">
      <div class="logo-icon">
        <i class="fas fa-sign-in-alt"></i>
      </div>
      <h1>Iniciar Sesión</h1>
      <p>Ingresa tus credenciales para continuar</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <div class="input-with-icon">
          <i class="fas fa-envelope"></i>
          <input type="email" id="email" placeholder="tu@email.com" required>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-with-icon">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
      </div>

      <div class="form-group">
        <button type="submit" class="btn" id="submitBtn">
          <i class="fas fa-sign-in-alt"></i>
          <span id="btnText">Ingresar al Sistema</span>
          <div class="loading" id="loadingIcon" style="display: none;"></div>
        </button>
      </div>
    </form>

    <div id="message"></div>

    <div class="links">
      <a href="register.html" class="link">
        <i class="fas fa-user-plus"></i>
        ¿No tienes cuenta? Regístrate
      </a>
      <br>
      <a href="index.html" class="link">
        <i class="fas fa-arrow-left"></i>
        Volver al inicio
      </a>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // Mostrar estado de carga
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const loadingIcon = document.getElementById('loadingIcon');
      const messageEl = document.getElementById('message');
      
      btnText.textContent = 'Procesando...';
      loadingIcon.style.display = 'inline-block';
      submitBtn.disabled = true;
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          messageEl.textContent = '✓ Acceso concedido. Redirigiendo...';
          messageEl.className = 'message-success';
          
          localStorage.setItem('token', data.token);
          localStorage.setItem('usuario', JSON.stringify(data.usuario));
          
          // Animación de éxito antes de redirigir
          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 1500);
        } else {
          messageEl.textContent = '✗ Error: ' + data.error;
          messageEl.className = 'message-error';
          
          // Efecto de shake en el formulario
          document.getElementById('loginForm').style.animation = 'shake 0.5s';
          setTimeout(() => {
            document.getElementById('loginForm').style.animation = '';
          }, 500);
        }
      } catch (error) {
        messageEl.textContent = '✗ Error de conexión. Intenta nuevamente.';
        messageEl.className = 'message-error';
      } finally {
        // Restaurar estado del botón
        btnText.textContent = 'Ingresar al Sistema';
        loadingIcon.style.display = 'none';
        submitBtn.disabled = false;
      }
    });
    

    const style = document.createElement('style');
    style.textContent = `
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
        20%, 40%, 60%, 80% { transform: translateX(5px); }
      }
    `;
    document.head.appendChild(style);
  </script>
</body>
</html>
