<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finalizar Compra | Nexus Shop</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://www.paypal.com/sdk/js?client-id=ASMexaZlYItsKWJtifG97LrDK2A7oRTaxV724114zS2Y5BBvC21XEbgrrsAb6u8OtbggHJAsFE-x4SFN"></script>
  <style>
    .pago-container {
      max-width: 1200px;
      padding: 20px;
    }
    
    .pago-header {
      margin-bottom: 40px;
    }
    
    .pago-content {
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 30px;
    }
    
    @media (max-width: 900px) {
      .pago-content {
        grid-template-columns: 1fr;
      }
    }
    
    .resumen-compra {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 30px;
      height: fit-content;
      position: sticky;
      top: 20px;
    }
    
    .producto-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .producto-info {
      flex: 1;
    }
    
    .producto-nombre {
      font-weight: 600;
      color: white;
    }
    
    .producto-cantidad {
      font-size: 12px;
      color: #94a3b8;
    }
    
    .producto-precio {
      font-weight: 700;
      color: var(--accent);
    }
    
    .total-section {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 2px solid rgba(255, 255, 255, 0.2);
    }
    
    .total-line {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    
    .total-final {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 20px;
      font-weight: 700;
      color: white;
    }
    
    .paypal-container {
      margin-top: 30px;
    }
    
    .metodos-pago {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
    }
    
    .metodo-pago {
      flex: 1;
      padding: 15px;
      background: rgba(255, 255, 255, 0.03);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
    }
    
    .metodo-pago.active {
      border-color: var(--accent);
      background: rgba(76, 201, 240, 0.1);
    }
    
    .metodo-pago i {
      font-size: 24px;
      margin-bottom: 10px;
    }
    
    .metodo-pago.paypal i {
      color: #003087;
    }
    
    .loading-pago {
      text-align: center;
      padding: 40px;
    }
    
    .orden-exitosa {
      text-align: center;
      padding: 40px;
      animation: scaleIn 0.5s ease;
    }
    
    .success-icon {
      font-size: 64px;
      color: var(--success);
      margin-bottom: 20px;
    }
    
    @keyframes scaleIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <!-- Fondo animado -->
  <div class="background-animation">
    <div class="gradient-circle circle-1"></div>
    <div class="gradient-circle circle-2"></div>
  </div>

  <div class="container pago-container">
    <div class="pago-header">
      <div style="display: flex; align-items: center; gap: 15px;">
        <i class="fas fa-lock" style="font-size: 32px; color: var(--accent);"></i>
        <div>
          <h1>Finalizar Compra</h1>
          <p>Completa tu pago de forma segura con PayPal</p>
        </div>
      </div>
    </div>
    
    <div id="contenidoPago">
      <!-- Contenido dinámico -->
    </div>
  </div>

  <script>
    // Variables globales
    let carritoData = null;
    let usuario = null;
    
    document.addEventListener('DOMContentLoaded', function() {
      usuario = JSON.parse(localStorage.getItem('usuario'));
      const token = localStorage.getItem('token');
      
      if (!token || !usuario) {
        window.location.href = 'login.html';
        return;
      }
      
      cargarCarrito();
    });
    
    async function cargarCarrito() {
      try {
        const token = localStorage.getItem('token');
        const response = await fetch('/carrito', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });
        
        carritoData = await response.json();
        
        if (response.ok) {
          if (!carritoData.items || carritoData.items.length === 0) {
            mostrarCarritoVacio();
          } else {
            mostrarResumenPago();
          }
        } else {
          mostrarError('Error al cargar el carrito');
        }
      } catch (error) {
        console.error('Error:', error);
        mostrarError('Error de conexión');
      }
    }
    
    function mostrarResumenPago() {
      const contenedor = document.getElementById('contenidoPago');
      
      const subtotal = parseFloat(carritoData.total);
      const impuestos = subtotal * 0.10;
      const envio = 5.99;
      const total = subtotal + impuestos + envio;
      
      let productosHtml = '';
      carritoData.items.forEach(item => {
        productosHtml += `
          <div class="producto-item">
            <div class="producto-info">
              <div class="producto-nombre">${item.nombre}</div>
              <div class="producto-cantidad">Cantidad: ${item.cantidad} | Código: ${item.codigo}</div>
            </div>
            <div class="producto-precio">$${parseFloat(item.subtotal).toFixed(2)}</div>
          </div>
        `;
      });
      
      contenedor.innerHTML = `
        <div class="pago-content">
          <!-- Resumen de productos -->
          <div class="resumen-compra">
            <h2 style="margin-bottom: 25px;">
              <i class="fas fa-shopping-bag"></i> Productos (${carritoData.items.length})
            </h2>
            
            ${productosHtml}
            
            <div class="total-section">
              <div class="total-line">
                <span>Subtotal</span>
                <span>$${subtotal.toFixed(2)}</span>
              </div>
              <div class="total-line">
                <span>Envío</span>
                <span>$${envio.toFixed(2)}</span>
              </div>
              <div class="total-line">
                <span>Impuestos (10%)</span>
                <span>$${impuestos.toFixed(2)}</span>
              </div>
              
              <div class="total-final">
                <span>Total a pagar</span>
                <span style="color: var(--accent);">$${total.toFixed(2)} USD</span>
              </div>
            </div>
          </div>
          
          <!-- PayPal Checkout -->
          <div class="resumen-compra">
            <h2 style="margin-bottom: 25px;">
              <i class="fab fa-paypal"></i> Pago con PayPal
            </h2>
            
            <div class="metodos-pago">
              <div class="metodo-pago paypal active">
                <i class="fab fa-paypal"></i>
                <div>PayPal</div>
                <small style="color: #94a3b8;">Tarjeta o cuenta</small>
              </div>
            </div>
            
            <div id="paypal-button-container" style="margin-top: 20px;"></div>
            
            <div style="margin-top: 20px; padding: 15px; background: rgba(255, 255, 255, 0.03); border-radius: 10px; font-size: 14px; color: #94a3b8;">
              <i class="fas fa-shield-alt"></i> 
              Tus datos están seguros. PayPal protege tu información financiera.
            </div>
          </div>
        </div>
      `;
      
      // Renderizar botón de PayPal
      renderPayPalButton(total.toFixed(2));
    }
    
    function renderPayPalButton(total) {
      if (typeof paypal === 'undefined') {
        console.error('PayPal SDK no cargado');
        document.getElementById('paypal-button-container').innerHTML = `
          <div style="text-align: center; padding: 20px; color: var(--error);">
            <i class="fas fa-exclamation-triangle"></i>
            Error al cargar PayPal. Por favor, recarga la página.
          </div>
        `;
        return;
      }
      
      paypal.Buttons({
        style: {
          layout: 'vertical',
          color: 'blue',
          shape: 'rect',
          label: 'paypal'
        },
        
        createOrder: function(data, actions) {
          return actions.order.create({
            purchase_units: [{
              amount: {
                value: total,
                currency_code: 'USD'
              },
              description: `Compra en Nexus Shop - ${usuario.nombre}`
            }]
          });
        },
        
        onApprove: function(data, actions) {
          // Mostrar loading
          document.getElementById('paypal-button-container').innerHTML = `
            <div class="loading-pago">
              <div class="loading-spinner"></div>
              <p>Procesando tu pago...</p>
            </div>
          `;
          
          // Capturar la orden
          return actions.order.capture().then(function(detalles) {
            procesarOrdenExitosa(detalles);
          });
        },
        
        onError: function(err) {
          console.error('Error en PayPal:', err);
          document.getElementById('paypal-button-container').innerHTML = `
            <div style="text-align: center; padding: 20px; color: var(--error);">
              <i class="fas fa-exclamation-circle"></i>
              Error al procesar el pago. Por favor, intenta nuevamente.
            </div>
          `;
        }
        
      }).render('#paypal-button-container');
    }
    
    async function procesarOrdenExitosa(detallesPayPal) {
      try {
        const token = localStorage.getItem('token');
        
        // Preparar items para la orden
        const items = carritoData.items.map(item => ({
          id: item.producto_id,
          nombre: item.nombre,
          codigo: item.codigo,
          cantidad: item.cantidad,
          precio: item.precio,
          subtotal: item.subtotal
        }));
        
        const ordenData = {
          orden_id_paypal: detallesPayPal.id,
          total: parseFloat(detallesPayPal.purchase_units[0].amount.value),
          items: items
        };
        
        const response = await fetch('/api/ordenes', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(ordenData)
        });
        
        const data = await response.json();
        
        if (response.ok) {
          mostrarOrdenExitosa(detallesPayPal, data.orden);
        } else {
          mostrarError('Error al registrar la orden: ' + data.error);
        }
      } catch (error) {
        console.error('Error:', error);
        mostrarError('Error al procesar la orden');
      }
    }
    
    function mostrarOrdenExitosa(detallesPayPal, orden) {
      const contenedor = document.getElementById('contenidoPago');
      
      const total = parseFloat(detallesPayPal.purchase_units[0].amount.value).toFixed(2);
      const ordenId = detallesPayPal.id;
      const fecha = new Date().toLocaleString();
      
      contenedor.innerHTML = `
        <div class="orden-exitosa">
          <div class="success-icon">
            <i class="fas fa-check-circle"></i>
          </div>
          
          <h2 style="margin-bottom: 15px;">¡Pago Exitoso!</h2>
          <p style="font-size: 18px; margin-bottom: 30px;">Gracias por tu compra, ${usuario.nombre}.</p>
          
          <div style="background: rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 30px; text-align: left; max-width: 500px; margin: 0 auto;">
            <h3 style="margin-bottom: 20px;">Detalles de la orden</h3>
            
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
              <span style="color: #94a3b8;">Número de orden:</span>
              <span style="font-weight: 600;">${ordenId.slice(-8).toUpperCase()}</span>
            </div>
            
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
              <span style="color: #94a3b8;">Fecha:</span>
              <span>${fecha}</span>
            </div>
            
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
              <span style="color: #94a3b8;">Método de pago:</span>
              <span><i class="fab fa-paypal"></i> PayPal</span>
            </div>
            
            <div style="display: flex; justify-content: space-between; margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255, 255, 255, 0.2);">
              <span style="font-size: 18px;">Total pagado:</span>
              <span style="font-size: 24px; font-weight: 700; color: var(--success);">$${total} USD</span>
            </div>
            
            <div style="margin-top: 30px; padding: 15px; background: rgba(74, 222, 128, 0.1); border-radius: 10px; color: var(--success);">
              <i class="fas fa-check"></i>
              Se ha enviado un correo de confirmación a ${usuario.email}
            </div>
          </div>
          
          <div style="display: flex; gap: 15px; justify-content: center; margin-top: 40px;">
            <button class="btn" onclick="window.location.href='historial.html'" style="width: auto; padding: 12px 30px;">
              <i class="fas fa-history"></i> Ver Mis Compras
            </button>
            <button class="btn btn-secondary" onclick="window.location.href='dashboard.html'" style="width: auto; padding: 12px 30px;">
              <i class="fas fa-store"></i> Seguir Comprando
            </button>
          </div>
        </div>
      `;
    }
    
    function mostrarCarritoVacio() {
      const contenedor = document.getElementById('contenidoPago');
      contenedor.innerHTML = `
        <div style="text-align: center; padding: 60px 20px;">
          <div style="font-size: 64px; margin-bottom: 20px; opacity: 0.3;">
            <i class="fas fa-shopping-cart"></i>
          </div>
          <h2 style="margin-bottom: 15px;">Tu carrito está vacío</h2>
          <p style="margin-bottom: 30px; color: #94a3b8;">Agrega productos antes de proceder al pago.</p>
          <button class="btn" onclick="window.location.href='dashboard.html'">
            <i class="fas fa-arrow-left"></i> Ir al Dashboard
          </button>
        </div>
      `;
    }
    
    function mostrarError(mensaje) {
      const contenedor = document.getElementById('contenidoPago');
      contenedor.innerHTML = `
        <div style="text-align: center; padding: 60px 20px;">
          <div style="font-size: 64px; margin-bottom: 20px; color: var(--error);">
            <i class="fas fa-exclamation-circle"></i>
          </div>
          <h2 style="margin-bottom: 15px;">Error</h2>
          <p style="margin-bottom: 30px; color: #ef4444;">${mensaje}</p>
          <div style="display: flex; gap: 15px; justify-content: center;">
            <button class="btn" onclick="window.location.href='carrito.html'">
              <i class="fas fa-arrow-left"></i> Volver al Carrito
            </button>
            <button class="btn btn-secondary" onclick="location.reload()">
              <i class="fas fa-redo"></i> Reintentar
            </button>
          </div>
        </div>
      `;
    }
    
    // Estilos para el loading spinner
    const style = document.createElement('style');
    style.textContent = `
      .loading-spinner {
        display: inline-block;
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: var(--accent);
        animation: spin 1s ease-in-out infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    `;
    document.head.appendChild(style);
  </script>
</body>
</html>
